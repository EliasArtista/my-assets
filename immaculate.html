<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Image Plane Explorer - Touch Enabled</title>
    <style>
        /* Basic styles to make the canvas fill the page */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            user-select: none; /* Prevent text selection on touch */
            -webkit-user-select: none;
            touch-action: none; /* Critical for custom gestures */
        }
        canvas {
            display: block;
        }

        /* Styling for the background video */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -100;
            opacity: 0.3;
            object-fit: cover;
        }

        /* Styling for the instruction overlay */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000; /* Above controls */
        }
        #instructions {
            width: 80%;
            max-width: 250px; 
            padding: 20px;
            background-color: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        #instructions.interactive:hover {
            transform: scale(1.02);
            cursor: pointer;
        }
        #instructions h2 {
            margin-top: 0;
            font-size: 1.4em;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        #instructions p {
            font-size: 0.9em; 
            line-height: 1.5;
            color: #aaa;
            margin-bottom: 0;
        }

        /* Speed indicator UI */
        #speed-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Mobile specific adjustments */
        @media (hover: none) and (pointer: coarse) {
            #instructions { font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="https://video.wixstatic.com/video/0b59fa_6aee3656ed344894bad682a1e4f310e3/1080p/mp4/file.mp4" type="video/mp4">
    </video>

    <!-- Blocker element for pointer lock instructions -->
    <div id="blocker">
        <div id="instructions">
            <h2>Loading...</h2>
            <p>Please wait.</p>
        </div>
    </div>

    <!-- Speed indicator UI element -->
    <div id="speed-indicator">Speed: 400</div>

    <!-- Import three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Import PointerLockControls -->
    <script type="module">
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.128.0/examples/jsm/controls/PointerLockControls.js';

        let scene, camera, renderer, controls;
        let planeMesh;
        let isMobile = false;

        // --- Input State (Desktop) ---
        const inputState = {
            fwd: 0, back: 0, left: 0, right: 0, up: 0, down: 0
        };

        let moveSpeed = 400.0;
        let prevTime = performance.now();
        let speedIndicatorTimeout;
        
        // --- Movement Boundaries ---
        const MIN_DISTANCE = 500; // Increased min distance for 2D view comfort
        const MAX_DISTANCE = 25000;

        function init() {
            // --- Scene Setup ---
            scene = new THREE.Scene();

            // Detect Mobile
            isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            // --- Camera Setup ---
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 50, 50000);
            
            // Initial position is handled in setupSceneWithTexture now
            
            // --- Renderer Setup ---
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true 
            });
            renderer.setPixelRatio(window.devicePixelRatio); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); 
            document.body.appendChild(renderer.domElement);
            
            // --- Asset Loading ---
            const loadingManager = new THREE.LoadingManager();
            const textureLoader = new THREE.TextureLoader(loadingManager);
            const imageUrl = 'https://static.wixstatic.com/media/0b59fa_3fe2ed09c5cd4419bf6827d673f41701~mv2.jpg';
            
            let loadedTexture;
            textureLoader.load(imageUrl, (texture) => {
                loadedTexture = texture;
            });
            
            loadingManager.onLoad = () => {
                setupSceneWithTexture(loadedTexture);
            };

            loadingManager.onError = (url) => {
                console.error('Error loading ' + url);
                document.getElementById('instructions').innerHTML = `<h2>Error</h2><p>Could not load assets.</p>`;
            };

            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize, false);
            
            // Start loop
            animate();
        }

        function setupSceneWithTexture(texture) {
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const planeSize = 10000;
            const aspectRatio = texture.image ? texture.image.width / texture.image.height : 1;
            const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize / aspectRatio);
            
            const planeMaterial = new THREE.MeshBasicMaterial({ 
                map: texture,
                side: THREE.DoubleSide 
            });

            planeMesh = new THREE.Mesh(planeGeometry, planeMaterial);
            scene.add(planeMesh);
            
            // --- Camera Positioning Based on Device ---
            if (isMobile) {
                // Mobile: Center view directly in front of the image
                // Calculate distance to fit the height
                const fov = camera.fov * (Math.PI / 180);
                const height = planeSize / aspectRatio;
                const distance = Math.abs(height / (2 * Math.tan(fov / 2)));
                
                // Start slightly zoomed out
                camera.position.set(0, 0, distance * 1.2); 
                camera.lookAt(0, 0, 0);
            } else {
                // Desktop: Angled "Fly" view
                camera.position.set(-56.3, -7978.9, 4038.7); 
                camera.lookAt(planeMesh.position);
            }

            setupControls();
            
            if (isMobile) {
                setupDirectTouchControls(); // New direct manipulation controls
            }

            // Update UI
            const instructions = document.getElementById('instructions');
            instructions.classList.add('interactive');
            
            if (isMobile) {
                instructions.innerHTML = `<h2>Tap to Start</h2><p>1 Finger: Pan<br>2 Fingers: Zoom & Pan</p>`;
            } else {
                instructions.innerHTML = `<h2>Click to Explore</h2><p>W,A,S,D: Fly<br>E,Q: Up/Down<br>Mouse: Look<br>Wheel: Speed</p>`;
            }
        }

        function setupControls() {
            controls = new PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');
            
            instructions.addEventListener('click', () => {
                if(instructions.classList.contains('interactive')) {
                    if (!isMobile) {
                        controls.lock();
                    } else {
                        blocker.style.display = 'none';
                    }
                }
            });

            controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
            controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

            scene.add(controls.getObject());

            // Keyboard Listeners (Desktop Only)
            const onKey = (event, isDown) => {
                const val = isDown ? 1 : 0;
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': inputState.fwd = val; break;
                    case 'KeyS': case 'ArrowDown': inputState.back = val; break;
                    case 'KeyA': case 'ArrowLeft': inputState.left = val; break;
                    case 'KeyD': case 'ArrowRight': inputState.right = val; break;
                    case 'KeyE': inputState.up = val; break; 
                    case 'KeyQ': inputState.down = val; break; 
                }
            };
            document.addEventListener('keydown', (e) => onKey(e, true));
            document.addEventListener('keyup', (e) => onKey(e, false));

            // Mouse Wheel Speed
            document.addEventListener('wheel', (event) => {
                if (event.deltaY < 0) moveSpeed *= 1.1;
                else moveSpeed /= 1.1;
                moveSpeed = Math.max(50, Math.min(12000, moveSpeed));
                showSpeedIndicator();
            });
        }

        // --- NEW: Powerful Direct Touch Controls (2D Viewer Mode) ---
        function setupDirectTouchControls() {
            let lastTouchX = 0;
            let lastTouchY = 0;
            let lastDist = 0;
            let isTouching = false;

            const getDistance = (t1, t2) => {
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            };

            const getCenter = (t1, t2) => {
                return {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
            };

            document.body.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isTouching = true;

                if (e.touches.length === 1) {
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    lastDist = getDistance(e.touches[0], e.touches[1]);
                    const center = getCenter(e.touches[0], e.touches[1]);
                    lastTouchX = center.x;
                    lastTouchY = center.y;
                }
            }, { passive: false });

            document.body.addEventListener('touchmove', (e) => {
                if (!isTouching) return;
                e.preventDefault();

                // Dynamic Pan Speed: Faster when zoomed out (high Z), Slower when zoomed in (low Z)
                // Normalize Z against a base value (e.g. 5000)
                const zoomLevel = Math.max(0.2, camera.position.z / 5000); 
                const panSpeed = 6.0 * zoomLevel; // Base multiplier
                const zoomSpeed = 8.0 * zoomLevel; // Powerful zoom multiplier

                if (e.touches.length === 1) {
                    // --- 1 Finger: Pan ---
                    const touch = e.touches[0];
                    const dx = touch.clientX - lastTouchX;
                    const dy = touch.clientY - lastTouchY;

                    camera.position.x -= dx * panSpeed;
                    camera.position.y += dy * panSpeed;

                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;

                } else if (e.touches.length === 2) {
                    // --- 2 Fingers: Pinch Zoom & Pan ---
                    const dist = getDistance(e.touches[0], e.touches[1]);
                    const center = getCenter(e.touches[0], e.touches[1]);

                    // Zoom Logic (Powerful)
                    const distChange = dist - lastDist;
                    
                    // Move camera Z directly
                    let newZ = camera.position.z - (distChange * zoomSpeed);
                    
                    // Clamp Z
                    newZ = Math.max(MIN_DISTANCE, Math.min(MAX_DISTANCE, newZ));
                    camera.position.z = newZ;

                    // Pan Logic (while zooming)
                    const dx = center.x - lastTouchX;
                    const dy = center.y - lastTouchY;

                    camera.position.x -= dx * panSpeed;
                    camera.position.y += dy * panSpeed;

                    lastDist = dist;
                    lastTouchX = center.x;
                    lastTouchY = center.y;
                }
            }, { passive: false });

            document.body.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    isTouching = false;
                } else if (e.touches.length === 1) {
                    // Reset anchor for single touch to prevent jumping
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                }
            });
        }
        
        function showSpeedIndicator() {
            const speedIndicator = document.getElementById('speed-indicator');
            speedIndicator.textContent = `Speed: ${Math.round(moveSpeed)}`;
            speedIndicator.style.opacity = '1';
            clearTimeout(speedIndicatorTimeout);
            speedIndicatorTimeout = setTimeout(() => {
                speedIndicator.style.opacity = '0';
            }, 2000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const forwardVector = new THREE.Vector3();
        const rightVector = new THREE.Vector3();
        const moveVector = new THREE.Vector3();
        const nextPosition = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            // On Mobile, we skip the physics loop entirely because movement 
            // is handled directly by touch events (1:1 mapping).
            // We only run this loop for Desktop (PointerLock).
            if (isMobile) {
                renderer.render(scene, camera);
                return;
            }

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            
            if (controls && controls.isLocked) {
                const moveDistance = moveSpeed * delta;
                
                camera.getWorldDirection(forwardVector);
                rightVector.setFromMatrixColumn(camera.matrixWorld, 0);

                moveVector.set(0,0,0);
                
                if (inputState.fwd > 0) moveVector.addScaledVector(forwardVector, 1);
                if (inputState.back > 0) moveVector.addScaledVector(forwardVector, -1);
                if (inputState.right > 0) moveVector.addScaledVector(rightVector, 1);
                if (inputState.left > 0) moveVector.addScaledVector(rightVector, -1);

                if (moveVector.lengthSq() > 0) {
                    moveVector.normalize();
                }

                nextPosition.copy(camera.position).addScaledVector(moveVector, moveDistance);

                if (inputState.up > 0) nextPosition.y += moveDistance;
                if (inputState.down > 0) nextPosition.y -= moveDistance;

                if (planeMesh) {
                    const nextDist = nextPosition.distanceTo(planeMesh.position);
                    if (nextDist > MIN_DISTANCE && nextDist < MAX_DISTANCE) {
                        camera.position.copy(nextPosition);
                    }
                }
            }
            
            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
