<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Distortion Flight Simulator</title>
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'zinc-350': '#b0b0b5',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Typography Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Absolute reset to prevent scrolling or browser context pull-downs */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-black font-sans">

  <!-- Background Video Layer -->
  <video
    id="bg-video"
    autoplay
    muted
    loop
    playsinline
    class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none opacity-[0.12]"
  >
    <source src="https://video.wixstatic.com/video/0b59fa_6aee3656ed344894bad682a1e4f310e3/1080p/mp4/file.mp4" type="video/mp4" />
  </video>

  <!-- Main Interactive Three.js Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full z-10">
    <canvas id="three-canvas" class="w-full h-full block"></canvas>
  </div>

  <!-- Real-time HUD Speed Overlay -->
  <div
    id="speed-indicator"
    class="absolute top-5 left-1/2 -translate-x-1/2 bg-black/75 border border-white/5 backdrop-blur-[10px] text-zinc-350 px-5 py-2.5 rounded-[24px] font-mono text-xs pointer-events-none opacity-0 transition-opacity duration-500 z-30 font-medium tracking-widest uppercase shadow-[0_4px_12px_rgba(0,0,0,0.5)]"
  >
    Speed: <span id="speed-value">400</span>
  </div>

  <!-- Blocker and Interactive UI Overlay -->
  <div
    id="blocker"
    class="absolute inset-0 bg-black/60 z-50 flex justify-center items-center cursor-pointer transition-opacity duration-300"
  >
    <div
      id="instructions"
      class="w-[80%] max-w-[250px] p-5 bg-[#0e0e0e]/95 backdrop-blur-[12px] border border-white/10 rounded-2xl text-center text-white shadow-[0_12px_40px_rgba(0,0,0,0.8)] hover:scale-[1.02] transform transition-transform duration-200"
    >
      <!-- Loading State Panel -->
      <div id="loader-panel" class="flex flex-col items-center justify-center">
        <div class="w-5 h-5 border-2 border-t-white border-r-transparent border-b-white border-l-transparent rounded-full animate-spin mb-2"></div>
        <h2 class="text-xs font-light tracking-widest uppercase mb-1 font-mono text-zinc-300">Loading...</h2>
        <p class="text-[10px] leading-relaxed text-zinc-500">Please wait.</p>
      </div>

      <!-- Instruction Panel -->
      <div id="info-panel" class="hidden">
        <h2 class="text-sm font-light tracking-widest uppercase mb-2.5 font-mono text-zinc-300">Click to Explore</h2>
        <p class="text-[10px] leading-relaxed text-zinc-400 font-sans select-none text-center">
          W, A, S, D : Fly<br />
          E, Q : Up / Down<br />
          Mouse : Look<br />
          Wheel : Speed
        </p>
      </div>
    </div>
  </div>

  <!-- ESM Modules importing ThreeJS + WebGL Postprocessing packages -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/controls/PointerLockControls.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/postprocessing/ShaderPass.js';

    // Application Elements
    const container = document.getElementById('canvas-container');
    const canvas = document.getElementById('three-canvas');
    const blocker = document.getElementById('blocker');
    const loaderPanel = document.getElementById('loader-panel');
    const infoPanel = document.getElementById('info-panel');
    const speedIndicator = document.getElementById('speed-indicator');
    const speedValue = document.getElementById('speed-value');

    // Basic Mobile Client Check
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // Speed Tracking
    let moveSpeed = 400;
    let speedTimeout = null;

    // Core Interaction States (Inertia Vectors)
    const inputState = { fwd: 0, back: 0, left: 0, right: 0, up: 0, down: 0 };
    const mousePosition = { x: 0.5, y: 0.5 };
    let scrollPulse = 0.0;
    const kbdVelocity = new THREE.Vector3(0, 0, 0);
    let scrollVelocity = 0.0;
    let mousePressed = 0.0;
    let clickIntensity = 0.0;
    let lastTime = performance.now();

    // Constant bounds
    const MIN_DISTANCE = 2;
    const MAX_DISTANCE = 150000;

    // ThreeJS Scene Objects
    let scene, camera, renderer, controls, composer, customPass, planeMesh, loadedTexture;

    function init() {
      const width = container.clientWidth;
      const height = container.clientHeight;

      // 1. Scene
      scene = new THREE.Scene();

      // 2. Adaptive Projection Camera
      if (isMobile) {
        camera = new THREE.OrthographicCamera(-width / 2, width / 2, height / 2, -height / 2, 1, 10000);
        camera.position.set(0, 0, 1000);
      } else {
        camera = new THREE.PerspectiveCamera(75, width / height, 50, 50000);
        camera.position.set(-56.3, -7978.9, 4038.7);
      }

      // 3. WebGL Renderer
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.setClearColor(0x000000, 0);

      // 4. Advanced Post-processing with GPU Fractal Lens Shader
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const distortionShader = {
        uniforms: {
          tDiffuse: { value: null },
          uTime: { value: 0 },
          uResolution: { value: new THREE.Vector2(width, height) },
          uDimLevel: { value: 0.45 },
          uMouse: { value: new THREE.Vector2(0.5, 0.5) },
          uScrollPulse: { value: 0.0 },
          uSpeedFactor: { value: 1.0 },
          uClickIntensity: { value: 0.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float uTime;
          uniform vec2 uResolution;
          uniform float uDimLevel;
          uniform vec2 uMouse;
          uniform float uScrollPulse;
          uniform float uSpeedFactor;
          uniform float uClickIntensity;
          varying vec2 vUv;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
              mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x),
              u.y
            );
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            vec2 shift = vec2(100.0);
            mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
            for (int i = 0; i < 4; ++i) {
              v += a * noise(p);
              p = rot * p * 2.0 + shift;
              a *= 0.5;
            }
            return v;
          }

          void main() {
            vec2 uv = vUv;
            vec2 centeredUv = uv - 0.5;
            float dist = length(centeredUv);

            vec2 toMouse = uv - uMouse;
            float lenToMouse = length(toMouse);

            float aspect = uResolution.x / uResolution.y;
            vec2 ovalCoords = vec2(toMouse.x * aspect * 0.70, toMouse.y * 1.05);
            float ovalDist = length(ovalCoords);

            float borderNoise = fbm(uv * 7.5 + vec2(uTime * 0.5)) * 0.05;
            float inNormalcy = smoothstep(0.38 + borderNoise, 0.04 - borderNoise, ovalDist);
            float normalcyMask = inNormalcy * uClickIntensity;

            float twistStrength = 0.15 + uScrollPulse * 2.8 + (uSpeedFactor * 0.4);
            float twistFactor = exp(-lenToMouse * 3.5) * twistStrength;
            float theta = twistFactor * sin(uTime * 0.9);
            float cosT = cos(theta);
            float sinT = sin(theta);
            mat2 twistRot = mat2(cosT, sinT, -sinT, cosT);
            
            vec2 warpedUv = uMouse + twistRot * toMouse;

            float wavePhase = lenToMouse * (20.0 + uScrollPulse * 15.0) - uTime * 6.0;
            float rippleAmp = 0.008 * (1.0 + uScrollPulse * 4.0) / (1.0 + lenToMouse * 12.0);
            vec2 rippleOffset = normalize(toMouse + vec2(0.0001)) * sin(wavePhase) * rippleAmp;
            warpedUv += rippleOffset;

            vec2 noiseUv1 = warpedUv * 6.0 + vec2(uTime * 0.12, uTime * 0.09);
            float n1 = fbm(noiseUv1);

            vec2 noiseUv2 = warpedUv * 12.0 - vec2(uTime * 0.08, -uTime * 0.15);
            float n2 = fbm(noiseUv2);

            float warpStrength = 0.015 + (uScrollPulse * 0.03) + (uSpeedFactor * 0.005);
            vec2 fractalOffset = vec2(
              cos(n1 * 6.28318) * warpStrength + sin(n2 * 6.283) * (warpStrength * 0.5),
              sin(n1 * 6.28318) * warpStrength + cos(n2 * 6.283) * (warpStrength * 0.5)
            );

            vec2 finalUv = warpedUv + fractalOffset;
            finalUv = mix(finalUv, uv, normalcyMask);
            finalUv = clamp(finalUv, vec2(0.001), vec2(0.999));

            float splitScale = 0.0035 + (uScrollPulse * 0.015) + (uSpeedFactor * 0.004);
            vec2 aberrationOffset = normalize(toMouse + vec2(0.0001)) * splitScale * (0.3 + lenToMouse * 1.5);
            vec2 finalAberrationOffset = aberrationOffset * (1.0 - normalcyMask);

            vec2 rOffset = clamp(finalUv + finalAberrationOffset, vec2(0.001), vec2(0.999));
            vec2 gOffset = finalUv;
            vec2 bOffset = clamp(finalUv - finalAberrationOffset, vec2(0.001), vec2(0.999));

            float r = texture2D(tDiffuse, rOffset).r;
            float g = texture2D(tDiffuse, gOffset).g;
            float b = texture2D(tDiffuse, bOffset).b;

            vec4 color = vec4(r, g, b, 1.0);

            float auraHaze = exp(-lenToMouse * 5.0) * (0.35 + uScrollPulse * 1.8);
            vec3 baseAuraColor = mix(
              vec3(0.0, 0.82, 1.0),
              vec3(1.0, 0.05, 0.50),
              uMouse.x
            );
            vec3 dynamicAuraColor = mix(baseAuraColor, vec3(0.5, 0.0, 1.0), sin(uTime * 1.5) * 0.3 + 0.3);
            color.rgb += dynamicAuraColor * auraHaze * 0.25 * (1.0 - normalcyMask);

            float borderGlow = normalcyMask * (1.0 - normalcyMask) * 4.0;
            vec3 rimColor = mix(vec3(0.0, 0.85, 1.0), vec3(0.5, 0.05, 1.0), sin(uTime * 1.5) * 0.5 + 0.5);
            color.rgb += rimColor * borderGlow * uClickIntensity * 0.18;

            float scanline = sin(uv.y * uResolution.y * 1.8) * 0.024;
            color.rgb -= vec3(scanline);

            float vignette = dist * 1.35;
            vignette = clamp(1.0 - vignette * vignette, 0.0, 1.0);
            color.rgb *= vignette;

            color.rgb *= uDimLevel;

            vec4 originalColor = texture2D(tDiffuse, uv);
            gl_FragColor = mix(color, originalColor, normalcyMask);
          }
        `
      };

      customPass = new ShaderPass(distortionShader);
      composer.addPass(customPass);

      // 5. PointerLockControls setup
      if (!isMobile) {
        controls = new PointerLockControls(camera, document.body);
        const controlsObj = controls.getObject ? controls.getObject() : controls.object;
        if (controlsObj) scene.add(controlsObj);

        controls.addEventListener('lock', () => {
          blocker.style.opacity = '0';
          setTimeout(() => { blocker.style.display = 'none'; }, 300);
        });

        controls.addEventListener('unlock', () => {
          blocker.style.display = 'flex';
          setTimeout(() => { blocker.style.opacity = '1'; }, 10);
        });
      }

      // 6. Loading of Space Explorative Texture Map
      const loadingManager = new THREE.LoadingManager();
      const textureLoader = new THREE.TextureLoader(loadingManager);

      const imageUrl = 'https://static.wixstatic.com/media/0b59fa_3fe2ed09c5cd4419bf6827d673f41701~mv2.jpg';

      textureLoader.load(imageUrl, (texture) => {
        loadedTexture = texture;
      }, undefined, (err) => {
        console.error('An error occurred during loading:', err);
        revealDashboard();
      });

      loadingManager.onLoad = () => {
        if (!loadedTexture) return;

        loadedTexture.minFilter = THREE.LinearMipmapLinearFilter;
        loadedTexture.magFilter = THREE.LinearFilter;
        loadedTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const planeSize = 10000;
        const aspect = loadedTexture.image ? loadedTexture.image.width / loadedTexture.image.height : 1;
        const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize / aspect);
        const planeMaterial = new THREE.MeshBasicMaterial({ map: loadedTexture, side: THREE.DoubleSide });

        planeMesh = new THREE.Mesh(planeGeometry, planeMaterial);
        scene.add(planeMesh);

        if (isMobile && camera instanceof THREE.OrthographicCamera) {
          const planeHeight = planeSize / aspect;
          const winAspect = width / height;
          const viewHeight = planeHeight * 1.2;
          const viewWidth = viewHeight * winAspect;

          camera.left = -viewWidth / 2;
          camera.right = viewWidth / 2;
          camera.top = viewHeight / 2;
          camera.bottom = -viewHeight / 2;
          camera.updateProjectionMatrix();

          camera.position.set(0, 0, 1000);
          camera.lookAt(0, 0, 0);
        } else {
          camera.lookAt(planeMesh.position);
        }

        revealDashboard();
      };

      bindInputListeners();
      tick();
    }

    function revealDashboard() {
      loaderPanel.classList.add('hidden');
      infoPanel.classList.remove('hidden');
    }

    // Input listeners binding
    function bindInputListeners() {
      // Keys Handling
      window.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': case 'ArrowUp': inputState.fwd = 1; break;
          case 'KeyS': case 'ArrowDown': inputState.back = 1; break;
          case 'KeyA': case 'ArrowLeft': inputState.left = 1; break;
          case 'KeyD': case 'ArrowRight': inputState.right = 1; break;
          case 'KeyE': inputState.up = 1; break;
          case 'KeyQ': inputState.down = 1; break;
        }
      });

      window.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': case 'ArrowUp': inputState.fwd = 0; break;
          case 'KeyS': case 'ArrowDown': inputState.back = 0; break;
          case 'KeyA': case 'ArrowLeft': inputState.left = 0; break;
          case 'KeyD': case 'ArrowRight': inputState.right = 0; break;
          case 'KeyE': inputState.up = 0; break;
          case 'KeyQ': inputState.down = 0; break;
        }
      });

      // Mouse Tracking
      window.addEventListener('mousemove', (e) => {
        if (isMobile) return;
        if (controls && controls.isLocked) {
          const speedScale = 0.0016;
          mousePosition.x = Math.max(0.001, Math.min(0.999, mousePosition.x + e.movementX * speedScale));
          mousePosition.y = Math.max(0.001, Math.min(0.999, mousePosition.y - e.movementY * speedScale));
        } else {
          mousePosition.x = e.clientX / window.innerWidth;
          mousePosition.y = 1.0 - (e.clientY / window.innerHeight);
        }
      });

      // Interactive Click Normalcy Dome
      window.addEventListener('mousedown', (e) => { if (e.button === 0) mousePressed = 1.0; });
      window.addEventListener('mouseup', (e) => { if (e.button === 0) mousePressed = 0.0; });
      window.addEventListener('blur', () => { mousePressed = 0.0; });

      // Precise Scroll Speed Decay System
      window.addEventListener('wheel', (e) => {
        if (isMobile) return;

        const rawDelta = e.deltaY;
        const scalingPower = -rawDelta * 0.0018; // Corrected precision tuning
        const multiplier = Math.exp(scalingPower);
        
        moveSpeed = Math.max(10, Math.min(250000, Math.round(moveSpeed * multiplier)));
        speedValue.innerText = moveSpeed;

        const scrollDirectionMultiplier = e.deltaY < 0 ? 1.0 : -1.0;
        scrollVelocity += scrollDirectionMultiplier * moveSpeed * 0.56;

        const maxScrollVel = moveSpeed * 3.0;
        scrollVelocity = Math.max(-maxScrollVel, Math.min(maxScrollVel, scrollVelocity));

        // Micro zoom jump
        if (camera) {
          const zoomDirection = new THREE.Vector3();
          camera.getWorldDirection(zoomDirection);
          const instantStep = scrollDirectionMultiplier * Math.max(8, moveSpeed * 0.09);
          const nextPos = camera.position.clone().addScaledVector(zoomDirection, instantStep);

          if (planeMesh) {
            const dist = nextPos.distanceTo(planeMesh.position);
            if (dist > MIN_DISTANCE && dist < MAX_DISTANCE) {
              camera.position.copy(nextPos);
            }
          } else {
            camera.position.copy(nextPos);
          }
        }

        // Chromatic pulse reaction
        scrollPulse = Math.min(3.5, scrollPulse + 0.13);

        // Display Toast
        speedIndicator.style.opacity = '1';
        if (speedTimeout) clearTimeout(speedTimeout);
        speedTimeout = setTimeout(() => { speedIndicator.style.opacity = '0'; }, 2000);
      }, { passive: true });

      // Enter Pointer Lock on clicking the overlay blocker
      blocker.addEventListener('click', () => {
        if (controls && !isMobile) {
          controls.lock();
        }
      });

      // Mobile touch setup
      if (isMobile && canvas) {
        setupMobileTouch();
      }

      // Responsive Resize
      const resizeObserver = new ResizeObserver((entries) => {
        if (!entries || entries.length === 0) return;
        const { width, height } = entries[0].contentRect;

        if (renderer && camera) {
          renderer.setSize(width, height);
          if (composer) {
            composer.setSize(width, height);
            if (customPass) {
              customPass.uniforms.uResolution.value.set(width, height);
            }
          }

          if (camera instanceof THREE.PerspectiveCamera) {
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
          } else if (camera instanceof THREE.OrthographicCamera) {
            const aspect = width / height;
            const visibleHeight = camera.top - camera.bottom;
            const visibleWidth = visibleHeight * aspect;

            camera.left = -visibleWidth / 2;
            camera.right = visibleWidth / 2;
            camera.updateProjectionMatrix();
          }
        }
      });
      resizeObserver.observe(container);
    }

    // Touch setup for mobile client
    function setupMobileTouch() {
      let lastTouchX = 0;
      let lastTouchY = 0;
      let startDist = 0;
      let startZoom = 1;
      let isTouching = false;

      const getDistance = (t1, t2) => {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      };

      const getCenter = (t1, t2) => {
        return {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
      };

      canvas.addEventListener('touchstart', (e) => {
        isTouching = true;
        mousePressed = 1.0;

        if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          startDist = getDistance(e.touches[0], e.touches[1]);
          if (camera instanceof THREE.OrthographicCamera) {
            startZoom = camera.zoom;
          }
          const center = getCenter(e.touches[0], e.touches[1]);
          lastTouchX = center.x;
          lastTouchY = center.y;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (!isTouching || !camera) return;

        if (e.touches.length === 1 && camera instanceof THREE.OrthographicCamera) {
          const touch = e.touches[0];
          const dx = touch.clientX - lastTouchX;
          const dy = touch.clientY - lastTouchY;

          const visibleHeight = (camera.top - camera.bottom) / camera.zoom;
          const ratio = visibleHeight / window.innerHeight;

          camera.position.x -= dx * ratio;
          camera.position.y += dy * ratio;

          mousePosition.x = touch.clientX / window.innerWidth;
          mousePosition.y = 1.0 - (touch.clientY / window.innerHeight);

          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;

        } else if (e.touches.length === 2 && camera instanceof THREE.OrthographicCamera) {
          const dist = getDistance(e.touches[0], e.touches[1]);
          const center = getCenter(e.touches[0], e.touches[1]);

          const zoomScale = dist / startDist;
          let newZoom = startZoom * zoomScale;
          newZoom = Math.max(0.1, Math.min(50, newZoom));

          camera.zoom = newZoom;
          camera.updateProjectionMatrix();

          const dx = center.x - lastTouchX;
          const dy = center.y - lastTouchY;

          const visibleHeight = (camera.top - camera.bottom) / camera.zoom;
          const ratio = visibleHeight / window.innerHeight;

          camera.position.x -= dx * ratio;
          camera.position.y += dy * ratio;

          mousePosition.x = center.x / window.innerWidth;
          mousePosition.y = 1.0 - (center.y / window.innerHeight);

          scrollPulse = Math.min(3.5, scrollPulse + Math.abs(zoomScale - 1.0) * 0.35);

          lastTouchX = center.x;
          lastTouchY = center.y;
        }
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          isTouching = false;
          mousePressed = 0.0;
        } else if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }, { passive: true });
    }

    // High performance render loop tick
    const forwardVector = new THREE.Vector3();
    const rightVector = new THREE.Vector3();
    const moveVector = new THREE.Vector3();
    const nextPosition = new THREE.Vector3();

    function tick() {
      requestAnimationFrame(tick);

      const currentTime = performance.now();
      const delta = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      // Update Dynamic Shader Uniforms
      if (customPass) {
        customPass.uniforms.uTime.value = currentTime * 0.001;

        if (scrollPulse > 0.005) {
          scrollPulse *= 0.94;
        } else {
          scrollPulse = 0.0;
        }
        customPass.uniforms.uScrollPulse.value = scrollPulse;

        if (mousePressed > 0.5) {
          clickIntensity += (1.0 - clickIntensity) * 0.12;
        } else {
          clickIntensity += (0.0 - clickIntensity) * 0.08;
        }
        customPass.uniforms.uClickIntensity.value = clickIntensity;

        const shaderMouse = customPass.uniforms.uMouse.value;
        const targetX = (controls && controls.isLocked) ? 0.5 : mousePosition.x;
        const targetY = (controls && controls.isLocked) ? 0.5 : mousePosition.y;
        shaderMouse.x += (targetX - shaderMouse.x) * 0.08;
        shaderMouse.y += (targetY - shaderMouse.y) * 0.08;

        customPass.uniforms.uSpeedFactor.value = moveSpeed / 400.0;
      }

      // Physics Inertial Flight system
      if (!isMobile && camera instanceof THREE.PerspectiveCamera) {
        moveVector.set(0, 0, 0);

        camera.getWorldDirection(forwardVector);
        rightVector.setFromMatrixColumn(camera.matrixWorld, 0);

        if (inputState.fwd > 0) moveVector.addScaledVector(forwardVector, 1);
        if (inputState.back > 0) moveVector.addScaledVector(forwardVector, -1);
        if (inputState.right > 0) moveVector.addScaledVector(rightVector, 1);
        if (inputState.left > 0) moveVector.addScaledVector(rightVector, -1);

        if (inputState.up > 0) moveVector.y += 1;
        if (inputState.down > 0) moveVector.y -= 1;

        if (moveVector.lengthSq() > 0) {
          moveVector.normalize();
        }

        const targetKbdVelocity = moveVector.clone().multiplyScalar(moveSpeed);
        const lerpFactor = Math.min(18.0 * delta, 1.0);
        kbdVelocity.lerp(targetKbdVelocity, lerpFactor);

        const displacement = new THREE.Vector3();

        // 1. Keyboard push
        if (kbdVelocity.lengthSq() > 0.01) {
          displacement.addScaledVector(kbdVelocity, delta);
        }

        // 2. Inertial Scroll Slide Zoom decays smoothly over dynamic air resistance friction
        if (Math.abs(scrollVelocity) > 1.0) {
          displacement.addScaledVector(forwardVector, scrollVelocity * delta);
          scrollVelocity *= Math.pow(0.24, delta);
        } else {
          scrollVelocity = 0.0;
        }

        // Apply consolidated movement bounds collision logic
        if (displacement.lengthSq() > 0.0001) {
          nextPosition.copy(camera.position).add(displacement);

          if (planeMesh) {
            const distance = nextPosition.distanceTo(planeMesh.position);
            if (distance > MIN_DISTANCE && distance < MAX_DISTANCE) {
              camera.position.copy(nextPosition);
            } else {
              scrollVelocity = 0.0;
              kbdVelocity.set(0, 0, 0);
            }
          } else {
            camera.position.copy(nextPosition);
          }
        }
      }

      // Render Stage
      if (composer) {
        composer.render();
      } else if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    // Init App
    window.addEventListener('DOMContentLoaded', init);
  </script>
